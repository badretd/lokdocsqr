[project]
name = "lokdocsqr"
version = "0.1.0"
description = "Local-first visual pipeline builder for file and table processing"
readme = "README.md"
authors = [
    { name = "Imran Badretdinov", email = "log8ka@proton.me" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES"]
requires-python = ">=3.10"
dependencies = [
    "deskew>=1.5.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "pyside6>=6.12.0",
    "pytesseract>=0.3.13",
    "typer>=0.27.3",
]

[project.scripts]
lokdocsqr = "lokdocsqr:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=2.3.3.260113",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["core", "nodes", "gui", "cli"]
extend-exclude = ["packaging", ".venv", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
    "PTH",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"nodes/scripting/*" = ["S102"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
exclude = ["packaging/", "dist/", "build/"]

[[tool.mypy.overrides]]
module = [
    "pytesseract.*",
    "pypdfium2.*",
    "deskew.*",
    "pytestqt.*",
]
ignore_missing_imports = true